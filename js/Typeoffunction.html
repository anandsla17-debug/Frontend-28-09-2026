function loop(n=1){
if(n==11){

// next function return
function calculator(a,b){

    console.log("calculator:");
    function add(a,b){
        return a+b;
    }
    return add(a,b);
}
console.log(calculator(10,10));

// callback function
function callback(x,y,callback){
    callback(x,y);

}

function logic(x,y){
    console.log("add"+(x+y));
    console.log("multi"+(x*y));
    console.log("div"+x/y);
}
callback(20,2,logic);

// callback function return
function callreturn(s1,s2,callreturn){
   return callreturn(s1,s2);

}

function returnlogic(a1,a2){
    return a1+a2;

}
console.log(callreturn("good","day",returnlogic));

console.log(callreturn(20,10,(s1,s2)=>s1*s2));
console.log(callreturn(30,2,function(s1,s2){
return s1/s2;
}));

}
console.log(object.a,object.b);
object.logic();
object.get();
