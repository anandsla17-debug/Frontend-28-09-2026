<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
    <script>
        console.log("operators=>arithmatic(+,-,*,/,%) ")
        console.log("add"+(70+90));
        console.log(80+100);
        console.log("sub:"+(60-90));
        console.log(100-50);
        console.log("multi:"+10*5);
        console.log("div:"+10/2);
        console.log("modules:"+11%2);
        console.log("assignment operator =,+=,-=,*=,%=,/=");
        let score=50;
        score=100;
        score+=50;
        score-=25;
        score*=2;
        score/=2;
        score%=4;
        console.log(score);
        console.log("comparsion operator or relation operation ==,===,!=.!==,>,<,>=,<=");
        let price="50";
        console.log(price==50); //== content do not check data type
        price="50";
        console.log(price==="50"); // === it will check content and data type
        console.log("lesser than:"+(25<50));
        console.log("greater than:"+(70>10));
        console.log("equal and lesser than"+(50<=50)); 
        console.log("equal and greater than:"+(21>=20));
        console.log("50"!=50);//it will be check only content
        console.log("60"!==60);// it will be check both data type and content
        console.log("logical operator=>and=>&& or=>|| not=>!")
        console.log(30<70 && 40!=41); // true and true=> true =>and gate
        console.log(40>50 || 70<100);  // true and false=>true =>or gate 
        console.log("bitwise operator=>and or xor not=>0=>flase 1=>true");
        console.log(50==51 ^ 60==60);
        //0111
        //0101
        //0101 =>and
        //0001=>1
        //0101=>5
        //0100=>xor =>4
        //0101 =>0r
        console.log(1^5);
        console.log(~5);
        console.log("terinary operator =?");
        let age=20;
        let result=age>=18?"eligible to vote":"not eligible";
        console.log(result);
        console.log("increment(post ++ and ++ pre ) and decrease=>(decrement=>-- pre  and post --)");
        let value=10;
        // increment
       console.log(value++);//post ++
       console.log(value);
       console.log(++value);
       //decrement
       let value1=20;
       console.log(value1--);// post --
       console.log(value1);
       console.log(--value1);




    </script>
