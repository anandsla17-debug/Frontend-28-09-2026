<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
.flex{
    display: flex;
    gap: 5px;
    flex-direction: row;
    /* col, row, row-reverse,col-reverse */

    border: 2px solid black;
    height: 600px;
    width: 100%;
    justify-content:center ;
    /* row=>justify-content: =>left to right; */
    /* col=> justify-content: top to bottom; */
    align-items: center ;
    /* row=>align-items: top to bottom*/
    /* col=>align-items: left to right:  */
    flex-wrap: nowrap;

}
*{
    margin: 2px;
}
p{
    background-color: forestgreen;
    width: 50px;
    height: 50px;
    text-align: center;
    align-content: center;
}

.box1{
order: 1;
flex-basis: 300px;
flex-grow: 1;
flex-shrink: 1;
}
.box2{
order:5;
flex-grow: 2;
flex-shrink: 2;
}
.box3{
order:7;
flex-grow: 1;
flex-shrink: 3;
}
.box4{
order:4;
flex-grow: 1;
flex-shrink: 1;
}
.box5{
order:2;
flex-grow: 1;
flex-shrink: 1;
}
.box6{
order:6;
flex-grow: 3;
flex-shrink: 1;
}
.box7{
order: 3;
flex-grow: 1;
flex-shrink: 1;
}
.box8{
order: 8;
flex-grow: 1;
flex-shrink: 1;
}
.box9{
order: 9;
flex-grow: 1;
flex-shrink: 1;
}
.box10{
order: 10;
flex-grow: 4;
flex-shrink: 1;
}

    </style>
</head>
<body>
    <div class="flex">
<p class="box1">1</p>
<p class="box2">2</p>
<p class="box3">3</p>
<p class="box4">4</p>
<p class="box5">5</p>
<p class="box6">6</p>
<p class="box7">7</p>
<p class="box8">8</p>
<p class="box9">9</p>
<p class="box10">10</p>
    </div>
</body>
</html>
