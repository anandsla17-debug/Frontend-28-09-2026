<!DOCTYPE html>
<html>  <!-- root element -->
    <head> <!-- title ,icons ,css,js,meta -->
<title>Html intro</title>
<link rel="icon"   href="Icons/htmlicons.png" type="image/png">
<meta charset="utf-8">
    </head>
    <body style="background-color: yellow;"> <!-- parent elment -->

        <div style="background-color: blue;">
        <h1>Html intro</h1> <!-- child element -->
        <h2>html intro</h2>
        <h3>html intro</h3>
        </div>
        <div style="background-color: aqua;">
        <h4>html intro</h4>
        <h5>html intro</h5>
        <h6>html intro</h6>
        </div>

        <!-- inline an block elements -->
         <hr>
         <h4 title="inline">inline element</h4>
        <div> 
            <u>html</u>
            <s>no important</s>
            <strong>important text=>s</strong>
            <b>important <small>text</small>=>b</b>
            <i>hello guys=> i</i>
            <em>hello guys=>em</em>
            <abbr title="hyper text markup language">html</abbr>
            <q>games</q>
            <span style="background-color: aqua;">h<sub>2</sub>o</span>
            <span><var>x</var><sup>2</sup>+y<sup>2</sup></span>
            <br>
            <bdo dir="rtl">hello word</bdo>

        </div>

    </body>

</html>
