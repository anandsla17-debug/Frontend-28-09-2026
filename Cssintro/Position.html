<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .heading{
position: relative;
top:60px;
left:90px
        }
        .student-img{
           position: relative;
           bottom: 70px;
        }

        .page{
          position: relative;
          
          z-index: 1;
         bottom: 120px;
         left: 5px;
        }
       
        .all{
position: relative;
bottom: 100px;
left:100px;
 font-size: 20px;
 z-index: 1;
        }
        .board{
            position: relative;
z-index: 1;
left: 55px;
height: 50px;
width: 200px;
border-radius: 20px;
background-color: rgb(172, 111, 32);
        }
         .video{
           
            position: relative;
             z-index: 0;
            bottom: 250px;
        }
        
    </style>
</head>
<body>
    
    <div>
    <p class="heading">welcome Students</p>
    <img class="student-img" src="student.png" width="100px" height="150px">
    </div>
    <div>
        <p class="board"></p>
        <h2 class="page">Student page</h2>
        <p class="all">Wellcome All</p>
        <video class="video"   muted autoplay  width="300px" height="600px" loop>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>
</body>
</html>
