<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Api</title>
    <script src="Store.js"></script>
             <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <form style="width: 300px;" class="container p-3 border border-primary mt-2" onsubmit="store(event)" >
        <p class="h4 text-center">user register</p>
        <input class="form-control mt-2" type="text" placeholder="Enter your name">
        <input  class="form-control mt-2"  type="number" placeholder="Enter your age">
        <input class="form-control mt-2"  type="clg" placeholder="Enter  your clg">
        <input class="form-control mt-2" type="number" placeholder="Enter your id">
        <button type="submit" class="w-100 mt-2 btn btn-success">submit</button>
<button onclick="update(event)" class="w-100 mt-2 btn btn-warning">Update</button>
<button onclick="deletes(event)" class="w-100 mt-2 btn btn-danger">Delete</button>

    </form>

    <table class="table container border border-primary table-bordered mt-2">
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>age</th>
                <th>clg</th>

            </tr>
        </thead>
        <tbody>
        <tr>
            <td colspan="4" id="store" class="text-center">do not store data</td>
        </tr>
        </tbody>
        <tbody>

        </tbody>
    </table>
    
    
</body>
</html>
