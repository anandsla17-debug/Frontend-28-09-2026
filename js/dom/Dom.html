<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>
    <script src="Dom.js"></script>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .bg{
            background-color: rgb(19, 5, 5);
            color: white;
            padding-left: 5px;
            padding-right: 5px;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <button onclick="changebg()" class="bg" >Dark</button>
    <form onsubmit="collectdata(event)" class="container border border-primary rounded p-2" style="width: 300px;" autocomplete="off">
        <p class="text-center h4">Student Registration</p>
        <input  class="form-control mt-2" type="number" placeholder="Enter your Student id" required>
        <input class="form-control mt-2" type="text" placeholder="Enter your student name" required>
        <input class="form-control mt-2" type="password" placeholder="Enter your password" required>
        <input class="form-control mt-2" type="text" placeholder="Enter your clg" required>
        <button class="btn btn-primary w-100 mt-2" type="submit">Register</button> 
    </form>
    <div id="result">

    </div>
</body>
</html>
