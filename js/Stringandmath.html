<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String and math method</title>
    <script>
        console.log("string and math");
        let s1="     hello students   ";
        let s2="Arun";
        console.log(s1.length);
        console.log(s1.charAt(10));
        console.log(s1.codePointAt(0));//assci
        console.log(s1.indexOf("s"));
        console.log(s1.lastIndexOf("s"));
        console.log(s1.includes("a"));
        console.log(s1.concat(" ",s2,"..."));
        console.log(s1.split(""));
        console.log(s1.startsWith("hello"));
        console.log(s1.endsWith("students"));
        console.log(s1.replace("hello","welcome"));
        console.log(s1.repeat(10));
        console.log(s1.trim());
        console.log(s1.trimStart());
        console.log(s1.trimEnd());
        console.log(s2.padStart(20,"⭐"));
        console.log(s2.padEnd(5,"⭐"));
        console.log(s2.slice(-1));// start ,lenth
        console.log(s2.substr(-3));//start and end
        console.log(s2.toLowerCase());
        console.log(s2.toUpperCase());
    </script>
</head>
<body>
    
</body>
</html>
